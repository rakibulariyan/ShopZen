<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 56 176 176" width="100%" height="100%">
  <defs>
    <linearGradient id="szIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16845B"/>
      <stop offset="100%" stop-color="#105C43"/>
    </linearGradient>
    <filter id="szShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#105C43" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Circular Badge Background -->
  <circle cx="144" cy="144" r="80" fill="url(#szIconGrad)" filter="url(#szShadow)"/>
  
  <!-- Basket Handle -->
  <path d="M117,126 C117,105 128,94 144,94 C160,94 171,105 171,126" 
        fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Basket Rim -->
  <path d="M106,128 L182,128" 
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Basket Body -->
  <path d="M111,135 L121,177 C122,182 126,185 131,185 L157,185 C162,185 166,182 167,177 L177,135" 
        fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Checkmark (ShopZen Accent Green) -->
  <path d="M125,157 L137,169 L163,141" 
        fill="none" stroke="#B8E986" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
