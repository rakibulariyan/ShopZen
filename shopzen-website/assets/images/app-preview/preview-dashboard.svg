<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16845B"/>
      <stop offset="100%" stop-color="#105C43"/>
    </linearGradient>
  </defs>

  <!-- Device Frame Background -->
  <rect width="390" height="800" rx="36" fill="#F7F9F7"/>
  <rect x="2" y="2" width="386" height="796" rx="34" fill="none" stroke="#D1DDD6" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#17221D">09:41</text>
  <circle cx="195" cy="22" r="7" fill="#17221D"/>
  <g transform="translate(325, 17)">
    <path d="M0,8 L4,4 L8,8 Z" fill="#17221D"/>
    <rect x="12" y="2" width="16" height="9" rx="2" fill="none" stroke="#17221D" stroke-width="1.5"/>
    <rect x="14" y="4" width="10" height="5" rx="1" fill="#16845B"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(24, 52)">
    <circle cx="18" cy="18" r="18" fill="#16845B"/>
    <path d="M12,18 L16,22 L24,14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#17221D">ShopZen</text>
    <circle cx="316" cy="18" r="16" fill="#E8F1EC"/>
    <path d="M311,18 C311,15.2 313.2,13 316,13 C318.8,13 321,15.2 321,18 C321,20.8 318.8,23 316,23 M319.5,21.5 L324,26" fill="none" stroke="#16845B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Quick Metrics Header Card -->
  <g transform="translate(20, 102)" filter="url(#cardShadow)">
    <rect width="350" height="94" rx="18" fill="url(#primaryGrad)"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#D3F0E2">ACTIVE LISTS &amp; SPEND</text>
    <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">$148.50</text>
    <text x="135" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#B8E986">/ $210.00 planned</text>
    <rect x="250" y="24" width="80" height="26" rx="13" fill="#105C43"/>
    <text x="264" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#B8E986">3 Lists</text>
  </g>

  <!-- Section Title -->
  <text x="24" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#17221D">Active Shopping Lists</text>

  <!-- Card 1: Weekly Groceries -->
  <g transform="translate(20, 240)" filter="url(#cardShadow)">
    <rect width="350" height="136" rx="16" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <!-- Title & Badge -->
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#17221D">Weekly Groceries</text>
    <rect x="256" y="18" width="74" height="22" rx="11" fill="#E8F6ED"/>
    <text x="268" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16845B">IN PROGRESS</text>
    
    <!-- Items & Budget Info -->
    <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#68766E">8 of 12 items purchased (67%)</text>
    
    <!-- Progress Bar -->
    <rect x="20" y="74" width="310" height="8" rx="4" fill="#EBF2EE"/>
    <rect x="20" y="74" width="207" height="8" rx="4" fill="#16845B"/>

    <!-- Spending footer -->
    <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#17221D">Spent: $94.20</text>
    <text x="110" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">· Budget: $130.00</text>
    <rect x="254" y="96" width="76" height="26" rx="13" fill="#16845B"/>
    <text x="268" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SHOPPING</text>
  </g>

  <!-- Card 2: Organic Farmers Market -->
  <g transform="translate(20, 390)" filter="url(#cardShadow)">
    <rect width="350" height="136" rx="16" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#17221D">Farmers Market</text>
    <rect x="270" y="18" width="60" height="22" rx="11" fill="#F0F4F2"/>
    <text x="282" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#68766E">PLANNED</text>
    
    <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#68766E">0 of 6 items purchased (0%)</text>
    
    <rect x="20" y="74" width="310" height="8" rx="4" fill="#EBF2EE"/>
    <rect x="20" y="74" width="10" height="8" rx="4" fill="#68766E"/>

    <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#17221D">Estimated: $54.30</text>
    <text x="145" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">· Budget: $60.00</text>
  </g>

  <!-- Card 3: Weekend Dinner Party -->
  <g transform="translate(20, 540)" filter="url(#cardShadow)">
    <rect width="350" height="110" rx="16" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#17221D">Weekend Dinner</text>
    <rect x="270" y="18" width="60" height="22" rx="11" fill="#F0F4F2"/>
    <text x="282" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#68766E">PLANNED</text>
    
    <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#68766E">0 of 5 items · Budget: $40.00</text>
  </g>

  <!-- Floating Action Button (+ New List) -->
  <g transform="translate(295, 650)" filter="url(#cardShadow)">
    <circle cx="32" cy="32" r="30" fill="#16845B"/>
    <path d="M32,20 L32,44 M20,32 L44,32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 724)">
    <rect width="390" height="76" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <!-- Home Tab (Active) -->
    <g transform="translate(48, 12)">
      <circle cx="16" cy="12" r="14" fill="#E8F6ED"/>
      <path d="M10,13 L16,8 L22,13 L22,19 L10,19 Z" fill="#16845B"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16845B" text-anchor="middle">Home</text>
    </g>
    <!-- History Tab -->
    <g transform="translate(180, 12)">
      <circle cx="16" cy="12" r="8" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <path d="M16,8 L16,12 L19,14" fill="none" stroke="#68766E" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#68766E" text-anchor="middle">History</text>
    </g>
    <!-- Settings Tab -->
    <g transform="translate(310, 12)">
      <circle cx="16" cy="12" r="7" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <path d="M16,2 L16,5 M16,19 L16,22 M6,12 L9,12 M23,12 L26,12" fill="none" stroke="#68766E" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#68766E" text-anchor="middle">Settings</text>
    </g>
  </g>
</svg>

