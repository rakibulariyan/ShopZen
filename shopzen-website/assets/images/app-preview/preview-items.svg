<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="800" rx="36" fill="#F7F9F7"/>
  <rect x="2" y="2" width="386" height="796" rx="34" fill="none" stroke="#D1DDD6" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#17221D">09:42</text>
  <circle cx="195" cy="22" r="7" fill="#17221D"/>
  <g transform="translate(325, 17)">
    <path d="M0,8 L4,4 L8,8 Z" fill="#17221D"/>
    <rect x="12" y="2" width="16" height="9" rx="2" fill="none" stroke="#17221D" stroke-width="1.5"/>
    <rect x="14" y="4" width="10" height="5" rx="1" fill="#16845B"/>
  </g>

  <!-- Top App Bar with Back & Actions -->
  <g transform="translate(20, 52)">
    <path d="M12,18 L4,10 L12,2" fill="none" stroke="#17221D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#17221D">Weekly Groceries</text>
    <circle cx="316" cy="10" r="3" fill="#17221D"/>
    <circle cx="326" cy="10" r="3" fill="#17221D"/>
    <circle cx="336" cy="10" r="3" fill="#17221D"/>
  </g>

  <!-- Budget Header Strip -->
  <g transform="translate(20, 96)" filter="url(#cardShadow)">
    <rect width="350" height="66" rx="14" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#68766E">BUDGET PROGRESS</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#16845B">$94.20 <tspan font-size="13" font-weight="500" fill="#68766E">spent of $130.00</tspan></text>
    <!-- Market Mode Action Button -->
    <rect x="236" y="16" width="98" height="34" rx="17" fill="#16845B"/>
    <text x="248" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">⚡ MARKET</text>
  </g>

  <!-- Category 1: Produce -->
  <g transform="translate(20, 180)">
    <rect x="0" y="0" width="100" height="24" rx="6" fill="#E8F6ED"/>
    <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#16845B">PRODUCE (4)</text>
  </g>

  <!-- Item 1: Organic Avocados (Purchased) -->
  <g transform="translate(20, 214)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="12" fill="#F0F4F2" stroke="#E2ECE5" stroke-width="1"/>
    <!-- Strikethrough Checkbox -->
    <rect x="14" y="18" width="28" height="28" rx="8" fill="#16845B"/>
    <path d="M20,32 L26,38 L36,26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#8A968F" text-decoration="line-through">Organic Avocados</text>
    <text x="54" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8A968F">4 pcs · Paid: $5.99</text>
    <text x="296" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8A968F">$5.99</text>
  </g>

  <!-- Item 2: Fresh Spinach (Pending) -->
  <g transform="translate(20, 288)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="12" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <rect x="14" y="18" width="28" height="28" rx="8" fill="none" stroke="#16845B" stroke-width="2"/>
    <text x="54" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#17221D">Baby Spinach</text>
    <text x="54" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">2 bags · Est. $3.50 ea</text>
    <text x="296" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#17221D">$7.00</text>
  </g>

  <!-- Item 3: Roma Tomatoes (Purchased) -->
  <g transform="translate(20, 362)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="12" fill="#F0F4F2" stroke="#E2ECE5" stroke-width="1"/>
    <rect x="14" y="18" width="28" height="28" rx="8" fill="#16845B"/>
    <path d="M20,32 L26,38 L36,26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#8A968F" text-decoration="line-through">Roma Tomatoes</text>
    <text x="54" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8A968F">1.5 kg · Paid: $4.20</text>
    <text x="296" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8A968F">$4.20</text>
  </g>

  <!-- Category 2: Dairy & Bakery -->
  <g transform="translate(20, 444)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#F3EEDA"/>
    <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8A6B12">DAIRY &amp; BAKERY (3)</text>
  </g>

  <!-- Item 4: Almond Milk (Pending) -->
  <g transform="translate(20, 478)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="12" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <rect x="14" y="18" width="28" height="28" rx="8" fill="none" stroke="#16845B" stroke-width="2"/>
    <text x="54" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#17221D">Unsweetened Almond Milk</text>
    <text x="54" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">2 cartons · Est. $3.89 ea</text>
    <text x="296" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#17221D">$7.78</text>
  </g>

  <!-- Item 5: Sourdough Bread (Purchased) -->
  <g transform="translate(20, 552)" filter="url(#cardShadow)">
    <rect width="350" height="64" rx="12" fill="#F0F4F2" stroke="#E2ECE5" stroke-width="1"/>
    <rect x="14" y="18" width="28" height="28" rx="8" fill="#16845B"/>
    <path d="M20,32 L26,38 L36,26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#8A968F" text-decoration="line-through">Artisan Sourdough</text>
    <text x="54" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8A968F">1 loaf · Paid: $5.50</text>
    <text x="296" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8A968F">$5.50</text>
  </g>

  <!-- Floating Add Item Button -->
  <g transform="translate(295, 640)" filter="url(#cardShadow)">
    <circle cx="32" cy="32" r="30" fill="#16845B"/>
    <path d="M32,20 L32,44 M20,32 L44,32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 724)">
    <rect width="390" height="76" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <g transform="translate(48, 12)">
      <circle cx="16" cy="12" r="14" fill="#E8F6ED"/>
      <path d="M10,13 L16,8 L22,13 L22,19 L10,19 Z" fill="#16845B"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16845B" text-anchor="middle">Home</text>
    </g>
    <g transform="translate(180, 12)">
      <circle cx="16" cy="12" r="8" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <path d="M16,8 L16,12 L19,14" fill="none" stroke="#68766E" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#68766E" text-anchor="middle">History</text>
    </g>
    <g transform="translate(310, 12)">
      <circle cx="16" cy="12" r="7" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <path d="M16,2 L16,5 M16,19 L16,22 M6,12 L9,12 M23,12 L26,12" fill="none" stroke="#68766E" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#68766E" text-anchor="middle">Settings</text>
    </g>
  </g>
</svg>

