<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="390" height="800" rx="36" fill="#F7F9F7"/>
  <rect x="2" y="2" width="386" height="796" rx="34" fill="none" stroke="#D1DDD6" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#17221D">09:45</text>
  <circle cx="195" cy="22" r="7" fill="#17221D"/>
  <g transform="translate(325, 17)">
    <path d="M0,8 L4,4 L8,8 Z" fill="#17221D"/>
    <rect x="12" y="2" width="16" height="9" rx="2" fill="none" stroke="#17221D" stroke-width="1.5"/>
    <rect x="14" y="4" width="10" height="5" rx="1" fill="#16845B"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(24, 52)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#17221D">Shopping History</text>
    <rect x="250" y="4" width="92" height="26" rx="13" fill="#E8F6ED"/>
    <text x="262" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16845B">🔒 IMMUTABLE</text>
  </g>

  <!-- Subtitle note -->
  <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Completed trips are archived as permanent, verifiable snapshots.</text>

  <!-- Trip Card 1 (Nov 7, 2026 - Weekly Supermarket) -->
  <g transform="translate(20, 114)" filter="url(#cardShadow)">
    <rect width="350" height="134" rx="16" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#17221D">Weekly Supermarket Run</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Completed: Nov 7, 2026 at 11:24 AM</text>
    
    <line x1="20" y1="68" x2="330" y2="68" stroke="#F0F4F2" stroke-width="1"/>

    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16845B">14 items purchased (100%)</text>
    <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Original budget: $135.00</text>

    <!-- Total badge -->
    <rect x="236" y="80" width="94" height="38" rx="10" fill="#E8F6ED"/>
    <text x="283" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#16845B" text-anchor="middle">$124.50</text>
  </g>

  <!-- Trip Card 2 (Oct 31, 2026 - Halloween Treats &amp; Party) -->
  <g transform="translate(20, 264)" filter="url(#cardShadow)">
    <rect width="350" height="134" rx="16" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#17221D">Halloween Treats &amp; Party</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Completed: Oct 31, 2026 at 04:15 PM</text>
    
    <line x1="20" y1="68" x2="330" y2="68" stroke="#F0F4F2" stroke-width="1"/>

    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16845B">9 items purchased (100%)</text>
    <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Original budget: $75.00</text>

    <rect x="236" y="80" width="94" height="38" rx="10" fill="#E8F6ED"/>
    <text x="283" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#16845B" text-anchor="middle">$68.20</text>
  </g>

  <!-- Trip Card 3 (Oct 24, 2026 - Fresh Produce Restock) -->
  <g transform="translate(20, 414)" filter="url(#cardShadow)">
    <rect width="350" height="134" rx="16" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#17221D">Produce Market Restock</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Completed: Oct 24, 2026 at 10:05 AM</text>
    
    <line x1="20" y1="68" x2="330" y2="68" stroke="#F0F4F2" stroke-width="1"/>

    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#16845B">7 items purchased (100%)</text>
    <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#68766E">Original budget: $45.00</text>

    <rect x="236" y="80" width="94" height="38" rx="10" fill="#E8F6ED"/>
    <text x="283" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#16845B" text-anchor="middle">$41.80</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 724)">
    <rect width="390" height="76" fill="#FFFFFF" stroke="#E2ECE5" stroke-width="1"/>
    <g transform="translate(48, 12)">
      <circle cx="16" cy="12" r="8" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <path d="M10,13 L16,8 L22,13 L22,19 L10,19 Z" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#68766E" text-anchor="middle">Home</text>
    </g>
    <!-- History Tab (Active) -->
    <g transform="translate(180, 12)">
      <circle cx="16" cy="12" r="14" fill="#E8F6ED"/>
      <circle cx="16" cy="12" r="8" fill="none" stroke="#16845B" stroke-width="2"/>
      <path d="M16,8 L16,12 L19,14" fill="none" stroke="#16845B" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16845B" text-anchor="middle">History</text>
    </g>
    <g transform="translate(310, 12)">
      <circle cx="16" cy="12" r="7" fill="none" stroke="#68766E" stroke-width="1.8"/>
      <path d="M16,2 L16,5 M16,19 L16,22 M6,12 L9,12 M23,12 L26,12" fill="none" stroke="#68766E" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#68766E" text-anchor="middle">Settings</text>
    </g>
  </g>
</svg>

