<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="szLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16845B"/>
      <stop offset="100%" stop-color="#105C43"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (Scaled down to 56x56 at x=12, y=12) -->
  <g transform="translate(12, 12)">
    <circle cx="28" cy="28" r="28" fill="url(#szLogoGrad)"/>
    
    <!-- Basket Handle -->
    <path d="M19,22 C19,15 22.5,11 28,11 C33.5,11 37,15 37,22" 
          fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Basket Rim -->
    <path d="M15,22.5 L41,22.5" 
          fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Basket Body -->
    <path d="M17,25 L20.5,39 C21,41 22,42 24,42 L32,42 C34,42 35,41 35.5,39 L39,25" 
          fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Checkmark -->
    <path d="M22,32 L26,36 L34,27" 
          fill="none" stroke="#B8E986" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Typography "ShopZen" -->
  <text x="82" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#17221D" letter-spacing="-0.5px">
    Shop<tspan fill="#16845B">Zen</tspan>
  </text>
</svg>

